<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <title>Error en el pago</title>
    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        
        body {
            min-height: 100dvh;
            padding: 15px;
            font-family: "Inter", sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            text-align: center;
        }
        
        img.svg-img {
            display: block;
            width: clamp(100px, 30vw, 160px);
            height: auto;
            margin: 0 auto;
            object-fit: contain;
        }
        
        h1 {
            width: min(658px, 100%);
            margin: clamp(20px, 3vh, 77px) auto 0;
            font-family: "Inter", sans-serif;
            font-size: clamp(30px, 3vw, 60px);
            color: #000000;
            text-align: center;
            font-weight: 500;
            line-height: 1.2;
            letter-spacing: 0;
        }
        
        p {
            width: min(900px, calc(100% - 30px));
            margin: clamp(20px, 3vh, 77px) auto 0;
            font-family: "Inter", sans-serif;
            font-size: clamp(17px, 3vw, 24px);
            color: #000;
            text-align: center;
            font-weight: 400;
            line-height: 1.4;
            letter-spacing: 0;
        }

        @media (max-width: 768px) {
            html,
            body {
                overflow: hidden;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="svg-img" src="no_ok.svg" alt="Operacion fallida">
        <h1 id="description"></h1>
        <p id="info"></p>
    </div>
    <script>
      const texts = {
        'es': { description: 'Error en el proceso de pago', info: 'Por favor vuelve a intentarlo escaneando el QR en el cargador' },
        'en': { description: 'Payment process error', info: 'Please try again by scanning the QR code on the charger' },
        'fr': { description: 'Erreur dans le processus de paiement', info: 'Veuillez réessayer en scannant le code QR sur le chargeur' }
      };
      const userLang = navigator.language || navigator.languages[0];
      const langCode = userLang.split('-')[0];
      const selectedTexts = texts[langCode] || texts['en'];
      document.getElementById('description').textContent = selectedTexts.description;
      document.getElementById('info').textContent = selectedTexts.info;
    </script>
</body>
</html>
