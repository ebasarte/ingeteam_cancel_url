<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <title>Error en el pago</title>
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            text-align: center;
            padding-top: clamp(20px, 12vh, 120px);
        }
        
        img.svg-img {
            display: block;
            width: 188px;
            height: 188px;
            margin: 0 auto;
            object-fit: contain;
        }
        
        h1 {
            margin: 0 0 20px;
            color: #c62828;
            font-size: clamp(24px, 7vw, 30px);
            font-weight: 700;
            line-height: 1.25;
        }
        
        p {
            margin: 0;
            color: #000;
            font-size: clamp(17px, 5vw, 20px);
            font-weight: 400;
            line-height: 1.4;
        }

        /* Ajustes para pantallas pequeñas */
        @media (max-width: 480px) {
            body {
                padding-top: 60px;
            }
            .svg-img {
                width: 120px;
                height: 120px;
            }

            h1 {
                width: calc(100% - 30px);
                margin-top: 40px;
                font-size: clamp(36px, 12vw, 60px);
                line-height: 1.2;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img class="svg-img" src="no_ok.svg" alt="Operacion fallida">
        <h1 id="description"></h1>
        <p id="info"></p>
    </div>
    <script>
      const texts = {
        'es': { description: 'Error en el proceso de pago', info: 'Por favor vuelve a intentarlo escaneando el QR en el cargador' },
        'en': { description: 'Payment process error', info: 'Please try again by scanning the QR code on the charger' },
        'fr': { description: 'Erreur dans le processus de paiement', info: 'Veuillez réessayer en scannant le code QR sur le chargeur' }
      };
      const userLang = navigator.language || navigator.languages[0];
      const langCode = userLang.split('-')[0];
      const selectedTexts = texts[langCode] || texts['en'];
      document.getElementById('description').textContent = selectedTexts.description;
      document.getElementById('info').textContent = selectedTexts.info;
    </script>
</body>
</html>
