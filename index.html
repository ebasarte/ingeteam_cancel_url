<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <title>Error en el pago</title>
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #fff5f5;
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .crossmark {
            font-size: 60px;
            color: #e53935;
            margin-bottom: 20px;
        }
        
        h1 {
            margin: 0 0 20px;
            color: #c62828;
            font-size: clamp(24px, 7vw, 30px);
            font-weight: 700;
            line-height: 1.25;
        }
        
        p {
            margin: 0;
            color: #000;
            font-size: clamp(17px, 5vw, 20px);
            font-weight: 400;
            line-height: 1.4;
        }
        
        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 25px;
            background-color: #e53935;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        
        .button:hover {
            background-color: #b71c1c;
        }
        
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }
        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }

        /* Ajustes para pantallas pequeñas */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
        
            .container {
                padding: 30px 20px;
            }
        
            .crossmark {
                font-size: 50px;
                margin-bottom: 15px;
            }
        
            h1 {
                margin-bottom: 15px;
            }
        
            .button {
                width: 100%;
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="crossmark">✗</div>
        <h1 id="description"></h1>
        <p id="info"></p>

        <footer>
            &copy; Ingeteam.
        </footer>
    </div>
    <script>
      const texts = {
        'es': { description: 'Ha ocurrido un error al procesar tu transacción', info: 'Por favor, vuelve a iniciar el proceso de carga' },
        'en': { description: 'An error occurred while processing your transaction', info: 'Please restart the charging process' },
        'fr': { description: 'Une erreur s’est produite lors du traitement de votre transaction', info: 'Veuillez redémarrer le processus de charge' }
      };
      const userLang = navigator.language || navigator.languages[0];
      const langCode = userLang.split('-')[0];
      const selectedTexts = texts[langCode] || texts['en'];
      document.getElementById('description').textContent = selectedTexts.description;
      document.getElementById('info').textContent = selectedTexts.info;
    </script>
</body>
</html>
